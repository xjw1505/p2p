<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101923">
  <title>Room · Group Chat</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">R</div><div><strong>ROOM</strong><span>LIVE MESSAGING</span></div></div>
      <div class="side-label">WORKSPACE</div>
      <div class="room-card active">
        <div class="room-icon">✳</div>
        <div class="room-copy"><strong>所有人</strong><span>实时群聊</span></div>
        <span class="room-dot"></span>
      </div>
      <div class="side-bottom">
        <div class="privacy-mark">◈</div>
        <div><strong>仅在线传输</strong><span>服务器不保存消息</span></div>
      </div>
    </aside>

    <main class="chat-panel">
      <header class="topbar">
        <div class="room-heading">
          <div class="room-icon large">✳</div>
          <div><h1>所有人</h1><div class="subtitle"><span id="connectionDot" class="connection-dot"></span><span id="connectionText">等待连接</span><span class="separator">·</span><span id="onlineCount">0 人在线</span></div></div>
        </div>
        <div class="top-actions">
          <button id="clearHistoryBtn" class="icon-button" type="button" title="清空本机聊天记录" aria-label="清空本机聊天记录">⌫</button>
          <div class="avatar self-avatar" id="myAvatar">?</div>
        </div>
      </header>

      <section id="chatFeed" class="chat-feed" aria-live="polite">
        <div id="welcomeCard" class="welcome-card">
          <div class="welcome-symbol">✳</div>
          <h2>一个房间，所有人都在这里。</h2>
          <p>发送文字、图片或文件。只有当前在线的成员能够收到新消息。</p>
          <div class="welcome-tags"><span>LIVE ONLY</span><span>NO SERVER HISTORY</span><span>LOCAL ARCHIVE</span></div>
        </div>
      </section>

      <div id="uploadStatus" class="upload-status" hidden><div class="upload-track"><div id="uploadProgress" class="upload-progress"></div></div><span id="uploadLabel">正在传输文件…</span></div>

      <footer class="composer-wrap">
        <div class="composer-tools">
          <button id="attachBtn" class="tool-button" type="button" title="发送图片或文件" aria-label="发送图片或文件">＋</button>
          <input id="fileInput" type="file" multiple hidden>
          <span class="tool-hint">支持图片、文档及其他文件，单文件最大 64 MB</span>
          <span class="local-hint"><span class="local-dot"></span>聊天记录仅保存在本机</span>
        </div>
        <div class="composer">
          <textarea id="messageInput" rows="1" maxlength="8000" placeholder="发送消息…（Enter 发送，Shift + Enter 换行）" disabled></textarea>
          <button id="sendBtn" class="send-button" type="button" disabled><span>发送</span><b>↗</b></button>
        </div>
      </footer>
    </main>
  </div>

  <div id="authOverlay" class="overlay">
    <form id="joinForm" class="join-card">
      <div class="join-logo">R</div>
      <div class="eyebrow">PRIVATE LIVE ROOM</div>
      <h2>加入群聊</h2>
      <p>输入昵称和群聊密码即可进入。相同密码的在线用户会进入同一个群聊。</p>
      <label for="nameInput">你的昵称</label>
      <input id="nameInput" maxlength="20" autocomplete="nickname" placeholder="例如：Guest" required>
      <label for="passwordInput">群聊密码</label>
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="输入群聊共享密码" required>
      <button id="joinBtn" class="join-button" type="submit">进入群聊 <span>↗</span></button>
      <div id="joinError" class="join-error" role="alert"></div>
      <div class="join-foot">消息实时转发 · 文件不在服务器留存</div>
    </form>
  </div>

  <div id="toast" class="toast" role="status"></div>
</body>
</html>
