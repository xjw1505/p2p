
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Chat · 水晶聊天室</title>
<script src="https://unpkg.com/mqtt@5.10.3/dist/mqtt.min.js"></script>
<style>
:root {
  --bg:#080b18;
  --panel:rgba(19,25,48,.72);
  --border:rgba(155,177,255,.16);
  --text:#edf1ff;
  --muted:#8995b8;
  --blue:#7c9cff;
  --cyan:#5ee7f5;
  --purple:#b18cff;
}
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 15% 15%,#25376a 0%,transparent 40%),
    radial-gradient(ellipse at 90% 85%,#38245d 0%,transparent 42%),
    var(--bg);
  color:var(--text);
  font-family:Inter,"Microsoft YaHei",sans-serif;
}
body:before{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;
  opacity:.2;
  background-image:
    linear-gradient(rgba(150,170,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(150,170,255,.05) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(to bottom,black,transparent);
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
  padding:18px;
  gap:16px;
  max-width:1700px;
  margin:auto;
}
.glass{
  background:var(--panel);
  border:1px solid var(--border);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  box-shadow:0 20px 60px rgba(0,0,0,.25),
             inset 0 1px rgba(255,255,255,.06);
  border-radius:22px;
}
.sidebar{
  display:flex;
  flex-direction:column;
  padding:22px 16px;
  min-height:0;
}
.brand{
  display:flex;align-items:center;gap:12px;
  padding:4px 8px 24px;
}
.logo{
  width:43px;height:43px;
  display:grid;place-items:center;
  border-radius:14px;
  font-size:24px;
  background:linear-gradient(135deg,#7b9cff,#c59aff,#62e8f2);
  box-shadow:0 0 30px #7c9cff55;
}
.brand-name{font-size:19px;font-weight:800;letter-spacing:1px}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:4px}
.profile{
  padding:14px;
  display:flex;align-items:center;gap:12px;
  border-radius:16px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.06);
}
.avatar{
  width:38px;height:38px;border-radius:13px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#668aff,#bd83ff);
  color:white;font-weight:800;
  flex-shrink:0;
}
.profile-name{font-size:13px;font-weight:700}
.profile-status{font-size:11px;color:#70e6ba;margin-top:5px}
.section-title{
  font-size:10px;letter-spacing:2px;color:#7482a9;
  margin:28px 8px 12px;
}
.room{
  padding:14px;
  border-radius:15px;
  background:linear-gradient(120deg,rgba(110,139,255,.17),rgba(175,119,255,.1));
  border:1px solid rgba(135,160,255,.2);
}
.room-label{font-size:10px;color:#aebbe0}
.room-name{font-size:15px;font-weight:800;margin-top:7px}
.room-id{font-size:10px;color:#8795bb;margin-top:8px;word-break:break-all}
.member-list{overflow:auto;min-height:0}
.member{
  display:flex;align-items:center;gap:10px;
  padding:10px 8px;border-radius:12px;
}
.member:hover{background:rgba(255,255,255,.04)}
.member .avatar{width:31px;height:31px;border-radius:10px;font-size:12px}
.member-name{font-size:12px;overflow:hidden;text-overflow:ellipsis}
.online-dot{
  width:7px;height:7px;border-radius:50%;
  background:#5ee6a5;margin-left:auto;
  box-shadow:0 0 10px #5ee6a5;
}
.sidebar-bottom{margin-top:auto;padding:15px 8px 0;color:#647092;font-size:10px}
.main{
  display:flex;flex-direction:column;min-width:0;min-height:0;
}
.topbar{
  padding:20px 24px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.room-heading{font-size:17px;font-weight:800}
.room-description{font-size:11px;color:var(--muted);margin-top:6px}
.connection{
  display:flex;align-items:center;gap:8px;
  color:#79e5b5;font-size:11px;
  padding:9px 13px;border-radius:30px;
  background:rgba(75,215,155,.08);
  border:1px solid rgba(75,215,155,.15);
}
.connection.offline{color:#ffb17a;background:#ff9b4510}
.messages{
  flex:1;overflow-y:auto;padding:24px;
  display:flex;flex-direction:column;gap:17px;
  scroll-behavior:smooth;
}
.message{display:flex;gap:10px;max-width:82%;align-items:flex-start}
.message.mine{align-self:flex-end;flex-direction:row-reverse}
.message .avatar{width:33px;height:33px;font-size:12px}
.message-body{min-width:0}
.message-meta{font-size:10px;color:#8995b8;margin:0 4px 7px}
.mine .message-meta{text-align:right}
.bubble{
  padding:12px 15px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.075);
  border-radius:4px 16px 16px 16px;
  font-size:13px;line-height:1.7;
  overflow-wrap:anywhere;
}
.mine .bubble{
  background:linear-gradient(135deg,rgba(105,137,255,.28),rgba(168,112,255,.22));
  border-color:rgba(155,168,255,.2);
  border-radius:16px 4px 16px 16px;
}
.system{
  align-self:center;color:#7582a5;
  font-size:10px;padding:7px 14px;
  background:rgba(255,255,255,.035);
  border-radius:20px;
}
.file-card{
  min-width:210px;
  padding:12px;border-radius:13px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.1);
}
.file-name{font-size:12px;word-break:break-all}
.file-size{font-size:10px;color:var(--muted);margin-top:5px}
.file-download{
  display:inline-block;margin-top:10px;
  color:#9cb7ff;font-size:11px;text-decoration:none;
}
.file-download:hover{text-decoration:underline}
.composer{
  margin:0 18px 18px;padding:12px;
  display:flex;align-items:flex-end;gap:10px;
  border-radius:18px;
  background:rgba(7,12,29,.6);
  border:1px solid var(--border);
}
.composer textarea{
  flex:1;resize:none;max-height:120px;min-height:42px;
  border:0;outline:0;background:transparent;
  color:var(--text);font:13px inherit;
  padding:12px 8px;
}
.composer textarea::placeholder{color:#647092}
.tool-btn,.send-btn{
  width:42px;height:42px;border:0;border-radius:13px;
  color:#aebdf0;background:rgba(255,255,255,.06);
  cursor:pointer;font-size:18px;
  transition:.2s;
}
.tool-btn:hover{background:rgba(125,150,255,.2);transform:translateY(-2px)}
.send-btn{
  width:76px;
  color:white;font-size:12px;font-weight:800;
  background:linear-gradient(120deg,#688dff,#a879ff);
  box-shadow:0 5px 20px #788aff44;
}
.send-btn:hover{filter:brightness(1.15);transform:translateY(-2px)}
input[type=file]{display:none}
.toast{
  position:fixed;bottom:25px;left:50%;
  transform:translate(-50%,20px);
  padding:12px 20px;border-radius:13px;
  background:#202b4b;border:1px solid #596b9c;
  color:white;font-size:12px;
  opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){
  .app{grid-template-columns:1fr;padding:8px;gap:8px}
  .sidebar{display:none}
  .main{height:calc(100vh - 16px)}
  .topbar{padding:15px}
  .messages{padding:15px}
  .message{max-width:95%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar glass">
    <div class="brand">
      <div class="logo">◇</div>
      <div>
        <div class="brand-name">CRYSTAL</div>
        <div class="brand-sub">PEER TO PEER CHAT</div>
      </div>
    </div>

    <div class="profile">
      <div class="avatar" id="myAvatar">?</div>
      <div>
        <div class="profile-name" id="myName">正在初始化</div>
        <div class="profile-status">● 在线</div>
      </div>
    </div>

    <div class="section-title">CURRENT SPACE</div>
    <div class="room">
      <div class="room-label">当前聊天室</div>
      <div class="room-name">✧ Crystal Lounge</div>
      <div class="room-id" id="roomId"></div>
    </div>

    <div class="section-title">ONLINE MEMBERS</div>
    <div class="member-list" id="members"></div>
    <div class="sidebar-bottom">CRYSTAL NETWORK · P2P</div>
  </aside>

  <main class="main glass">
    <header class="topbar">
      <div>
        <div class="room-heading">Crystal Lounge ✧</div>
        <div class="room-description">一个无需注册的开放式水晶空间</div>
      </div>
      <div class="connection offline" id="connection">● 正在连接网络</div>
    </header>

    <div class="messages" id="messages">
      <div class="system">欢迎来到 Crystal Lounge</div>
      <div class="system">消息通过点对点连接传输</div>
    </div>

    <div class="composer">
      <label class="tool-btn" title="发送文件">
        ＋
        <input id="fileInput" type="file">
      </label>
      <textarea id="messageInput" rows="1" placeholder="输入消息，按 Enter 发送..."></textarea>
      <button class="send-btn" id="sendBtn">发送 ↗</button>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const ROOM = new URLSearchParams(location.search).get("room") || "crystal-lounge";
const ROOT = "crystal-chat/v1/" + ROOM;
const BROKERS = [
  "wss://broker.emqx.io:8084/mqtt",
  "wss://broker.hivemq.com:8884/mqtt"
];

const id = crypto.randomUUID();
const name = "Crystal-" + id.slice(0,4);
const color = ["#789bff","#bd8cff","#62dce8","#f0a4d0"][Math.floor(Math.random()*4)];
const peers = new Map();
const members = new Map();
const seen = new Set();
let client = null;
let brokerIndex = 0;
let online = false;
let fileSeq = 0;

$("myName").textContent = name;
$("myAvatar").textContent = name.slice(-2);
$("myAvatar").style.background = color;
$("roomId").textContent = ROOM;

function toast(message) {
  $("toast").textContent = message;
  $("toast").classList.add("show");
  setTimeout(() => $("toast").classList.remove("show"),2500);
}

function systemMessage(message) {
  const el = document.createElement("div");
  el.className = "system";
  el.textContent = message;
  $("messages").appendChild(el);
  scrollBottom();
}

function scrollBottom() {
  $("messages").scrollTop = $("messages").scrollHeight;
}

function renderMembers() {
  const list = $("members");
  list.replaceChildren();
  for(const m of members.values()) {
    const item = document.createElement("div");
    item.className = "member";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = m.name.slice(-2);
    avatar.style.background = m.color || color;
    const label = document.createElement("div");
    label.className = "member-name";
    label.textContent = m.name + (m.id === id ? " (我)" : "");
    const dot = document.createElement("div");
    dot.className = "online-dot";
    item.append(avatar,label,dot);
    list.appendChild(item);
  }
}

function addText(msg) {
  if(seen.has(msg.mid)) return false;
  seen.add(msg.mid);
  if(seen.size > 2000) seen.delete(seen.values().next().value);

  const mine = msg.from === id;
  const wrapper = document.createElement("div");
  wrapper.className = "message" + (mine ? " mine" : "");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = (msg.name || "?").slice(-2);
  avatar.style.background = msg.color || color;

  const body = document.createElement("div");
  body.className = "message-body";

  const meta = document.createElement("div");
  meta.className = "message-meta";
  meta.textContent = (msg.name || "未知用户") + " · " +
    new Date(msg.time || Date.now()).toLocaleTimeString();

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = msg.text;

  body.append(meta,bubble);
  wrapper.append(avatar,body);
  $("messages").appendChild(wrapper);
  scrollBottom();
  return true;
}

function publish(topic,data,retain=false) {
  if(!client || !client.connected) return;
  client.publish(topic,JSON.stringify(data),{
    qos:0,retain
  });
}

function sendSignal(to,data) {
  publish(ROOT + "/signal/" + to,{
    from:id,to,...data
  });
}

function announce() {
  publish(ROOT + "/presence/" + id,{
    id,name,color,seenAt:Date.now()
  },true);
}

function connectBroker(index=0) {
  if(index >= BROKERS.length) {
    $("connection").textContent = "● 信令服务不可用";
    $("connection").classList.add("offline");
    toast("公共信令服务器连接失败");
    return;
  }

  brokerIndex = index;
  $("connection").textContent = "● 正在连接";
  const c = mqtt.connect(BROKERS[index],{
    clientId:"crystal_" + id.replaceAll("-","").slice(0,20),
    clean:true,
    connectTimeout:10000,
    reconnectPeriod:3000
  });
  client = c;

  c.on("connect",() => {
    online = true;
    $("connection").textContent = "● 信令服务已连接";
    $("connection").classList.remove("offline");

    c.subscribe([
      ROOT + "/presence/+",
      ROOT + "/signal/" + id
    ]);

    announce();
    systemMessage("已进入聊天室，正在寻找其他成员");
    setInterval(announce,12000);
  });

  c.on("message",(topic,payload) => {
    let data;
    try { data = JSON.parse(payload.toString()); }
    catch { return; }

    if(topic.startsWith(ROOT + "/presence/")) {
      if(data.id === id) return;

      if(data.offline) {
        members.delete(data.id);
        renderMembers();
        return;
      }

      members.set(data.id,data);
      renderMembers();

      if(!peers.has(data.id) && id < data.id) {
        createPeer(data.id,true);
      }
    }

    if(topic === ROOT + "/signal/" + id) {
      handleSignal(data);
    }
  });

  c.on("error",() => {});
  c.on("close",() => {
    online = false;
    $("connection").textContent = "● 连接中断";
    $("connection").classList.add("offline");
  });
}

function createPeer(peerId,initiator) {
  if(peers.has(peerId)) return peers.get(peerId);

  const pc = new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun.cloudflare.com:3478"}
    ]
  });

  const state = {
    pc,channel:null,initiator,
    pendingIce:[]
  };
  peers.set(peerId,state);

  pc.onicecandidate = e => {
    if(e.candidate) {
      sendSignal(peerId,{
        type:"ice",
        candidate:e.candidate
      });
    }
  };

  pc.onconnectionstatechange = () => {
    if(pc.connectionState === "connected") {
      systemMessage("已与一位成员建立 P2P 连接");
    }
    if(["failed","closed"].includes(pc.connectionState)) {
      state.channel?.close();
      peers.delete(peerId);
    }
  };

  if(initiator) {
    const channel = pc.createDataChannel("crystal-data");
    setupChannel(state,channel);
    pc.createOffer().then(offer => pc.setLocalDescription(offer))
      .then(() => sendSignal(peerId,{
        type:"offer",sdp:pc.localDescription
      }))
      .catch(() => toast("建立连接失败"));
  } else {
    pc.ondatachannel = e => setupChannel(state,e.channel);
  }

  return state;
}

function setupChannel(state,channel) {
  state.channel = channel;
  channel.binaryType = "arraybuffer";
  channel.onmessage = e => receiveData(state,e.data);
  channel.onopen = () => {};
  channel.onclose = () => {};
}

async function handleSignal(data) {
  if(!data.from || data.from === id || data.to !== id) return;

  let state = peers.get(data.from);

  if(data.type === "offer") {
    if(!state) state = createPeer(data.from,false);
    await state.pc.setRemoteDescription(data.sdp);
    const answer = await state.pc.createAnswer();
    await state.pc.setLocalDescription(answer);
    sendSignal(data.from,{
      type:"answer",sdp:state.pc.localDescription
    });
    for(const candidate of state.pendingIce.splice(0)) {
      await state.pc.addIceCandidate(candidate);
    }
  }

  if(data.type === "answer" && state) {
    await state.pc.setRemoteDescription(data.sdp);
    for(const candidate of state.pendingIce.splice(0)) {
      await state.pc.addIceCandidate(candidate);
    }
  }

  if(data.type === "ice") {
    if(!state) state = createPeer(data.from,false);
    if(state.pc.remoteDescription) {
      await state.pc.addIceCandidate(data.candidate).catch(()=>{});
    } else {
      state.pendingIce.push(data.candidate);
    }
  }
}

function broadcast(packet) {
  const payload = JSON.stringify(packet);
  for(const state of peers.values()) {
    if(state.channel?.readyState === "open") {
      state.channel.send(payload);
    }
  }
}

function sendMessage() {
  const input = $("messageInput");
  const value = input.value.trim();
  if(!value) return;

  const msg = {
    kind:"text",
    mid:id + ":" + crypto.randomUUID(),
    from:id,name,color,
    time:Date.now(),
    text:value
  };

  addText(msg);
  broadcast(msg);
  input.value = "";
  input.focus();
}

const incomingFiles = new Map();

function sendFile(file) {
  const targets = [...peers.values()]
    .filter(p => p.channel?.readyState === "open");

  if(!targets.length) {
    toast("目前没有可用的 P2P 连接");
    return;
  }

  const fid = id + ":" + (++fileSeq);
  const chunkSize = 16 * 1024;

  const packet = {
    kind:"file-start",fid,
    name:file.name,size:file.size,
    mime:file.type || "application/octet-stream",
    from:id,sender:name
  };

  for(const p of targets) p.channel.send(JSON.stringify(packet));

  let offset = 0;
  const reader = new FileReader();

  reader.onload = () => {
    const buffer = reader.result;
    for(const p of targets) {
      if(p.channel?.readyState === "open") {
        p.channel.send(buffer);
      }
    }
    offset += buffer.byteLength;
    if(offset < file.size) {
      readNext();
    } else {
      for(const p of targets) {
        if(p.channel?.readyState === "open") {
          p.channel.send(JSON.stringify({kind:"file-end",fid}));
        }
      }
      systemMessage("文件已发送：" + file.name);
    }
  };

  function readNext() {
    const slice = file.slice(offset,offset + chunkSize);
    reader.readAsArrayBuffer(slice);
  }

  readNext();
}

function receiveData(state,data) {
  if(typeof data !== "string") {
    const current = state.receiving;
    if(!current) return;
    current.chunks.push(data);
    current.received += data.byteLength;
    return;
  }

  let packet;
  try { packet = JSON.parse(data); }
  catch { return; }

  if(packet.kind === "text") {
    if(addText(packet)) broadcast(packet);
  }

  if(packet.kind === "file-start") {
    state.receiving = {
      ...packet,
      chunks:[],
      received:0
    };
    systemMessage(packet.sender + " 正在发送文件：" + packet.name);
  }

  if(packet.kind === "file-end") {
    const f = state.receiving;
    if(!f || f.fid !== packet.fid) return;

    const blob = new Blob(f.chunks,{type:f.mime});
    const url = URL.createObjectURL(blob);
    const card = document.createElement("div");
    card.className = "file-card";

    const title = document.createElement("div");
    title.className = "file-name";
    title.textContent = "◇ " + f.name;

    const size = document.createElement("div");
    size.className = "file-size";
    size.textContent = (f.size / 1024 / 1024).toFixed(2) + " MB";

    const link = document.createElement("a");
    link.className = "file-download";
    link.href = url;
    link.download = f.name;
    link.textContent = "下载文件 ↓";

    card.append(title,size,link);

    const wrapper = document.createElement("div");
    wrapper.className = "message";
    wrapper.appendChild(card);
    $("messages").appendChild(wrapper);
    scrollBottom();

    state.receiving = null;
  }
}

$("sendBtn").onclick = sendMessage;

$("messageInput").addEventListener("keydown",e => {
  if(e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

$("fileInput").onchange = e => {
  const file = e.target.files[0];
  if(file) sendFile(file);
  e.target.value = "";
};

window.addEventListener("beforeunload",() => {
  publish(ROOT + "/presence/" + id,{
    id,offline:true
  },true);
  for(const p of peers.values()) p.pc.close();
});

members.set(id,{id,name,color});
renderMembers();

if(typeof mqtt === "undefined") {
  toast("MQTT 库加载失败，请刷新页面");
} else {
  connectBroker();
}
})();
</script>
</body>
</html>
